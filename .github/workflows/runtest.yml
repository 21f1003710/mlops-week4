name: Sanity test

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn tensorflow matplotlib>=3.4 cml

      - name: 🧪 Run tests
        run: |
          python test.py > test_output.txt

      - name: 📊 Generate CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## 🧪 Test Results" > report.md
          echo '```' >> report.md
          cat test_output.txt >> report.md
          echo '```' >> report.md

          echo -e "\n## 📈 Metrics from Training\n" >> report.md
          echo '```csv' >> report.md
          tail -n 5 models/metrics.csv >> report.md
          echo '```' >> report.md

          cml comment create report.md
